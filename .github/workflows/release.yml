# Builds the Windows installer and publishes it on the repository's Releases page.
#
# Two ways to start it:
#   • On GitHub: Actions → "Release" → "Run workflow" → type a version like 0.1.1 → Run.
#     (No terminal needed. GitHub creates the v0.1.1 tag and release for you.)
#   • From a terminal: git tag v0.1.1 && git push origin v0.1.1
#
# The version you give is written into the app, so you never have to edit package.json by hand.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, e.g. 0.1.1 (must be higher than the last release)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the release and upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python (for castLabs VMP signing)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install castLabs EVS client
        run: python -m pip install --upgrade castlabs-evs

      - name: Fetch GitHub dependencies over HTTPS (no SSH key on the runner)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Set the app version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME}"; fi
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$V')"; exit 1
          fi
          npm version "$V" --no-git-tag-version --allow-same-version
          echo "Building Unisono $V"

      - name: Build, VMP-sign and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          # Fail the build if signing fails — but only once you've added the EVS secrets.
          VMP_REQUIRED: ${{ secrets.EVS_ACCOUNT_NAME != '' && '1' || '0' }}
        run: npx electron-builder --win --x64 --publish always
