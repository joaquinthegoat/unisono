# Builds the Windows installer and publishes it as a GitHub Release.
# Runs when you push a version tag such as v0.1.0 (create one with `npm version patch`).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write # needed to create the release and upload the installer

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python (for castLabs VMP signing)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install castLabs EVS client
        run: python -m pip install --upgrade castlabs-evs

      - name: Fetch GitHub dependencies over HTTPS (no SSH key on the runner)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build, VMP-sign and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          VMP_REQUIRED: '1'
        run: npx electron-builder --win --x64 --publish always
